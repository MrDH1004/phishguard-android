name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ github.ref_name }}
    steps:
      - name: Verify tag format (vMAJOR.MINOR.PATCH)
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]] || { echo "bad tag: $GITHUB_REF_NAME"; exit 1; }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu 러너에 Android SDK가 기본 설치돼 있음 (ANDROID_HOME)
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test and build release APK (저장소의 고정 키로 서명)
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain

      - name: Rename APK and write SHA-256
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/phishguard-${VERSION_NAME}.apk"
          cd dist && sha256sum "phishguard-${VERSION_NAME}.apk" > "phishguard-${VERSION_NAME}.apk.sha256"
          cat "phishguard-${VERSION_NAME}.apk.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/phishguard-${{ github.ref_name }}.apk
            dist/phishguard-${{ github.ref_name }}.apk.sha256
